[project]
name = "spyglass"
version = "0.1.0"
description = "Lightweight observability: metrics and log collection with a local SQLite backend."
authors = [{name = "Mohit Nalavadi"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "flask>=3.1.3",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "schedule>=1.2.2",
    "sqlalchemy>=2.1.4",
    "typer>=0.27.3",
]

[tool.config]
data_dir = "data"
host = "0.0.0.0"
port = 5013
retention_days = 30
write_flush_interval_s = 600

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spyglass"]


[project.scripts]
spyglass-config = "spyglass.config:main"
spyglass = "spyglass.cli:main"

[tool.black]
line-length = 110
target-version = ['py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-s -v --cov=. --cov-report=term-missing"
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*", "*/test_*.py"]

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { certifi = false }

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.deploy]
# Databases live one directory deep, under data/<monitored-project>/.
db_layout = "nested"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF100", "PLW1510"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.isort]
force-single-line = true
