{% extends "dashboard/_base.html" %}

{% block title %}claude-usage-notch-server{% endblock %}

{% block sections %}

  <div class="card-full stat-row">

    <div class="chart-card col-1">
      <h3 class="chart-title">Analytics query duration</h3>
      <canvas id="chartDuration" aria-label="Analytics query duration over time"></canvas>
    </div>

    <div class="chart-card col-1">
      <h3 class="chart-title">DB writes</h3>
      <canvas id="chartDbWrites" aria-label="DB writes over time"></canvas>
    </div>

    <section class="card col-1" aria-labelledby="ingestHeading">
      <div class="card-header">
        <h2 id="ingestHeading">Ingest &amp; Backfill</h2>
      </div>
      <div class="stat-grid stat-grid--two-col">
        <div class="stat">
          <span class="stat-label">Records inserted</span>
          <span id="stat-records-inserted" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Snapshots inserted</span>
          <span id="stat-snapshots-inserted" class="stat-value">—</span>
        </div>
        <div class="stat stat--wide">
          <span class="stat-label">Backfilled records</span>
          <span id="stat-backfill-inserted" class="stat-value">—</span>
        </div>
      </div>
    </section>

  </div>

{% endblock %}

{% block script %}
<script>
const PROJECT = "claude-usage-notch-server";
const M = {
  analyticsDuration: `${PROJECT}.get_analytics.duration`,
  recordsInserted:   `${PROJECT}.post_records.records_inserted`,
  snapshotsInserted: `${PROJECT}.post_quota_snapshots.quota_snapshots_inserted`,
  backfillInserted:  `${PROJECT}.backfill.records_inserted`,
};

initDashboard({
  project: PROJECT,
  defaultWindowAmount: 1,
  defaultWindowUnit: "days",
  defaultRollupMinutes: 15,
  loadFn: async (win, signal) => {
    await Promise.allSettled([
      buildLineChart("chartDuration", PROJECT, [
        { label: "analytics (ms)", metricName: M.analyticsDuration, color: COLORS.accent },
      ], win, signal),

      buildLineChart("chartDbWrites", PROJECT, [
        { label: "Records written",    metricName: M.recordsInserted,   color: COLORS.accent,  fill: true },
        { label: "Snapshots written",  metricName: M.snapshotsInserted, color: COLORS.success, fill: true },
        { label: "Backfilled records", metricName: M.backfillInserted,  color: COLORS.purple,  fill: true },
      ], win, signal),

      fillStats(PROJECT, [
        { elementId: "stat-records-inserted",   metricName: M.recordsInserted,   pick: (s) => s.sum, format: "count" },
        { elementId: "stat-snapshots-inserted", metricName: M.snapshotsInserted, pick: (s) => s.sum, format: "count" },
        { elementId: "stat-backfill-inserted",  metricName: M.backfillInserted,  pick: (s) => s.sum, format: "count" },
      ], win, signal),
    ]);
  },
});
</script>
{% endblock %}
