{# Project rail. `project` is the active slug, or undefined on the index page. #}
<nav class="sidebar" id="sidebar" aria-label="Project navigation">
  <div class="sidebar-brand">
    <a class="sidebar-brand-link" href="/dashboard/" title="spyglass">spyglass</a>
    <button class="sidebar-collapse-btn" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true" title="Collapse sidebar">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
  <div class="sidebar-nav">
    <span class="sidebar-section-label">Dashboards</span>
    {% for p in projects %}
    <a class="sidebar-link{% if p == project|default(none) %} is-active{% endif %}" href="/dashboard/{{ p }}" title="{{ p }}">
      <span class="sidebar-link-mark">{{ p[0]|upper }}</span><span class="sidebar-link-text">{{ p }}</span>
    </a>
    {% endfor %}
  </div>
</nav>
